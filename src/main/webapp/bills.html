<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Bill | Sunrise Dental Clinic</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #dff7fb, #f7fcfd);
        padding: 40px 20px;
        color: #28444f;
      }

      .bill-container {
        width: 100%;
        max-width: 620px;
        margin: auto;

        background: #ffffff;

        border-radius: 22px;
        padding: 40px 45px;

        border-top: 6px solid #18aebb;

        box-shadow: 0 15px 45px rgba(0, 105, 135, 0.15);
      }

      .page-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .bill-icon {
        font-size: 48px;
        margin-bottom: 8px;
      }

      .page-header h1 {
        color: #087f94;
        font-size: 29px;
        margin-bottom: 5px;
      }

      .page-header h2 {
        color: #445e69;
        font-size: 21px;
        margin-bottom: 8px;
      }

      .page-header p {
        color: #83959d;
        font-size: 14px;
      }

      form {
        width: 100%;
      }

      .form-section {
        margin-bottom: 28px;
      }

      .form-section h3 {
        color: #087f94;
        font-size: 18px;

        margin-bottom: 20px;
        padding-bottom: 10px;

        border-bottom: 2px solid #e1f1f4;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;

        font-size: 14px;
        font-weight: 600;

        color: #354f5a;
      }

      input,
      select {
        width: 100%;

        padding: 13px 14px;

        border: 1px solid #cbdde2;
        border-radius: 9px;

        background: #fbfefe;

        font-family: inherit;
        font-size: 15px;

        color: #344f5b;

        outline: none;

        transition: 0.25s;
      }

      input:focus,
      select:focus {
        border-color: #12a6b7;
        background: #ffffff;

        box-shadow: 0 0 0 3px rgba(18, 166, 183, 0.12);
      }

      select {
        cursor: pointer;
      }

      input[readonly] {
        background: #edf5f7;
        color: #5e747d;
        cursor: not-allowed;
      }

      .amount-box {
        background: #f2fbfc;
        border: 1px solid #d5eef2;
        border-radius: 12px;

        padding: 20px;
        margin-bottom: 25px;
      }

      .total-group input {
        font-size: 19px;
        font-weight: 700;

        color: #087f94;

        background: #eaf9fb;

        border: 2px solid #b9e5ea;
      }

      .info-message {
        display: none;
        margin-top: 10px;

        padding: 12px 14px;

        border-radius: 8px;

        background: #fff4d6;
        color: #8b6500;

        font-size: 13px;
      }

      .create-btn {
        width: 100%;

        padding: 15px;

        border: none;
        border-radius: 10px;

        background: linear-gradient(135deg, #16afbd, #087e98);

        color: #ffffff;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;

        box-shadow: 0 5px 14px rgba(8, 126, 152, 0.2);

        transition: 0.25s;
      }

      .create-btn:hover {
        background: linear-gradient(135deg, #20bfca, #066d87);

        transform: translateY(-2px);

        box-shadow: 0 8px 18px rgba(8, 126, 152, 0.25);
      }

      .create-btn:active {
        transform: translateY(0);
      }

      .create-btn:disabled {
        background: #b7c5ca;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      .back-section {
        text-align: center;
        margin-top: 22px;
      }

      .back-btn {
        display: inline-block;

        padding: 9px 16px;

        border-radius: 7px;

        color: #087f94;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;

        transition: 0.2s;
      }

      .back-btn:hover {
        background: #e8f8fa;
      }

      .footer {
        text-align: center;

        margin-top: 26px;
        padding-top: 18px;

        border-top: 1px solid #e4eeee;

        color: #95a4a9;

        font-size: 12px;
      }

      @media (max-width: 600px) {
        .bill-container {
          padding: 30px 24px;
        }

        .page-header h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="bill-container">
      <div class="page-header">
        <div class="bill-icon">🧾</div>

        <h1>Sunrise Dental Clinic</h1>

        <h2>Create Patient Bill</h2>

        <p>Select a pending appointment and generate the patient bill</p>
      </div>

      <form id="billForm" action="BillServlet" method="post">
        <input type="hidden" name="action" value="add" />

        <div class="form-section">
          <h3>📋 Billing Details</h3>

          <div class="form-group">
            <label for="appointmentNo"> Pending Appointment Number </label>

            <select id="appointmentNo" name="appointmentNo" required>
              <option value="">Loading pending appointments...</option>
            </select>

            <div id="appointmentMessage" class="info-message"></div>
          </div>

          <div class="amount-box">
            <div class="form-group">
              <label for="consultationFee"> Consultation Fee (LKR) </label>

              <input
                type="number"
                id="consultationFee"
                name="consultationFee"
                step="0.01"
                min="0"
                value="1000"
                required
              />
            </div>

            <div class="form-group">
              <label for="treatmentCost"> Treatment Cost (LKR) </label>

              <input
                type="number"
                id="treatmentCost"
                name="treatmentCost"
                step="0.01"
                min="0"
                placeholder="Enter treatment cost"
                required
              />
            </div>

            <div class="form-group total-group">
              <label for="totalAmount"> Total Amount (LKR) </label>

              <input
                type="number"
                id="totalAmount"
                name="totalAmount"
                step="0.01"
                readonly
              />
            </div>
          </div>

          <div class="form-group">
            <label for="billDate"> Bill Date </label>

            <input type="date" name="billDate" id="billDate" required />
          </div>
        </div>

        <button type="submit" class="create-btn" id="createBillBtn">
          🧾 Create Bill
        </button>
      </form>

      <div class="back-section">
        <a href="staffDashboard.html" class="back-btn">
          ← Back to Staff Dashboard
        </a>
      </div>

      <div class="footer">Sunrise Dental Clinic Management System</div>
    </div>

    <script>
      const appointmentSelect = document.getElementById("appointmentNo");

      const appointmentMessage = document.getElementById("appointmentMessage");

      const createBillBtn = document.getElementById("createBillBtn");

      const consultationFee = document.getElementById("consultationFee");

      const treatmentCost = document.getElementById("treatmentCost");

      const totalAmount = document.getElementById("totalAmount");

      const billDate = document.getElementById("billDate");

      // ============================================
      // Load pending appointments
      // ============================================

      fetch("SearchAppointmentServlet")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Unable to load appointments");
          }

          return response.json();
        })

        .then((data) => {
          appointmentSelect.innerHTML = "";

          const defaultOption = document.createElement("option");

          defaultOption.value = "";
          defaultOption.textContent = "Select a pending appointment";

          appointmentSelect.appendChild(defaultOption);

          if (!data || data.length === 0) {
            showNoPendingAppointments();

            return;
          }

          const pendingAppointments = data.filter((appointment) => {
            const status = (appointment.status || "Pending")
              .trim()
              .toLowerCase();

            return status === "pending";
          });

          if (pendingAppointments.length === 0) {
            showNoPendingAppointments();

            return;
          }

          pendingAppointments.forEach((appointment) => {
            const option = document.createElement("option");

            option.value = appointment.appointmentNo;

            option.textContent = appointment.appointmentNo;

            appointmentSelect.appendChild(option);
          });

          // Enable bill button
          createBillBtn.disabled = false;

          // --------------------------------------------
          // Optional:
          // If user comes from Appointment Management
          // bills.html?appointmentNo=APT001
          // automatically select it if still Pending
          // --------------------------------------------

          const params = new URLSearchParams(window.location.search);

          const appointmentFromUrl = params.get("appointmentNo");

          if (appointmentFromUrl) {
            const exists = pendingAppointments.some(
              (appointment) =>
                String(appointment.appointmentNo) ===
                String(appointmentFromUrl),
            );

            if (exists) {
              appointmentSelect.value = appointmentFromUrl;
            }
          }
        })

        .catch((error) => {
          console.error("Error loading appointments:", error);

          appointmentSelect.innerHTML =
            '<option value="">Unable to load appointments</option>';

          appointmentSelect.disabled = true;

          createBillBtn.disabled = true;

          appointmentMessage.style.display = "block";

          appointmentMessage.textContent =
            "Unable to load pending appointments. Please try again.";
        });

      // ============================================
      // No Pending Appointments
      // ============================================

      function showNoPendingAppointments() {
        appointmentSelect.innerHTML =
          '<option value="">No pending appointments available</option>';

        appointmentSelect.disabled = true;

        createBillBtn.disabled = true;

        appointmentMessage.style.display = "block";

        appointmentMessage.textContent =
          "All available appointments have already been billed or there are currently no pending appointments.";
      }

      // ============================================
      // Today's date
      // ============================================

      const today = new Date().toISOString().split("T")[0];

      billDate.value = today;

      // Prevent future bill dates
      billDate.max = today;

      // ============================================
      // Calculate Total
      // ============================================

      function calculateTotal() {
        const consultation = parseFloat(consultationFee.value) || 0;

        const treatment = parseFloat(treatmentCost.value) || 0;

        totalAmount.value = (consultation + treatment).toFixed(2);
      }

      consultationFee.addEventListener("input", calculateTotal);

      treatmentCost.addEventListener("input", calculateTotal);

      calculateTotal();

      // ============================================
      // Final validation before submit
      // ============================================

      document
        .getElementById("billForm")
        .addEventListener("submit", function (e) {
          const selectedAppointment = appointmentSelect.value;

          const consultation = parseFloat(consultationFee.value);

          const treatment = parseFloat(treatmentCost.value);

          const enteredTotal = parseFloat(totalAmount.value);

          // Appointment validation
          if (!selectedAppointment) {
            alert("Please select a pending appointment.");

            e.preventDefault();

            return;
          }

          // Fee validation
          if (
            isNaN(consultation) ||
            isNaN(treatment) ||
            consultation < 0 ||
            treatment < 0
          ) {
            alert(
              "Consultation fee and treatment cost must be valid positive values.",
            );

            e.preventDefault();

            return;
          }

          const expectedTotal = consultation + treatment;

          // Total validation
          if (Math.abs(expectedTotal - enteredTotal) > 0.001) {
            alert("Total amount must equal Consultation Fee + Treatment Cost.");

            e.preventDefault();

            return;
          }

          // Bill date validation
          if (!billDate.value) {
            alert("Please select the bill date.");

            e.preventDefault();

            return;
          }

          if (billDate.value > today) {
            alert("Bill date cannot be a future date.");

            e.preventDefault();

            return;
          }
        });
    </script>
  </body>
</html>
