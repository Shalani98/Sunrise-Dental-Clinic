<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Sunrise Dental Clinic</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;

        min-height: 100vh;

        background: linear-gradient(135deg, #dff7fb, #f8fcfd);

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;

        color: #29464f;
      }

      /* Login Container */

      .login-box {
        width: 100%;
        max-width: 430px;

        background: #ffffff;

        padding: 42px 40px;

        border-radius: 22px;

        border-top: 6px solid #13a9b8;

        box-shadow: 0 15px 45px rgba(0, 105, 135, 0.15);
      }

      /* Header */

      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .tooth-icon {
        width: 75px;
        height: 75px;

        margin: 0 auto 15px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #e8f9fb;

        border-radius: 50%;

        font-size: 42px;
      }

      .clinic-name {
        color: #087f94;

        font-size: 25px;
        font-weight: 700;

        margin-bottom: 7px;
      }

      .login-header h2 {
        color: #405d68;

        font-size: 21px;

        margin-bottom: 7px;
      }

      .login-header p {
        color: #899ba2;
        font-size: 14px;
      }

      /* Form */

      .form-group {
        margin-bottom: 21px;
      }

      label {
        display: block;

        margin-bottom: 8px;

        color: #354f5a;

        font-size: 14px;
        font-weight: 600;
      }

      input {
        width: 100%;

        padding: 13px 14px;

        border: 1px solid #cbdde2;
        border-radius: 9px;

        background: #fbfefe;

        color: #344f5b;

        font-family: inherit;
        font-size: 15px;

        outline: none;

        transition: 0.25s;
      }

      input:focus {
        border-color: #12a6b7;

        background: #ffffff;

        box-shadow: 0 0 0 3px rgba(18, 166, 183, 0.12);
      }

      input::placeholder {
        color: #a4b1b6;
      }

      /* Login Button */

      .login-btn {
        width: 100%;

        padding: 14px;

        margin-top: 5px;

        border: none;
        border-radius: 10px;

        background: linear-gradient(135deg, #16afbd, #087e98);

        color: #ffffff;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;

        box-shadow: 0 5px 14px rgba(8, 126, 152, 0.2);

        transition: 0.25s;
      }

      .login-btn:hover {
        background: linear-gradient(135deg, #20bfca, #066d87);

        transform: translateY(-2px);

        box-shadow: 0 8px 18px rgba(8, 126, 152, 0.25);
      }

      .login-btn:active {
        transform: translateY(0);
      }

      /* Security Message */

      .security-note {
        margin-top: 22px;

        padding: 12px;

        background: #f1fafb;

        border-radius: 8px;

        color: #70878f;

        text-align: center;

        font-size: 12px;
        line-height: 1.5;
      }

      /* Back Link */

      .back-section {
        text-align: center;
        margin-top: 20px;
      }

      .back-link {
        color: #087f94;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      /* Footer */

      .footer {
        text-align: center;

        margin-top: 25px;
        padding-top: 18px;

        border-top: 1px solid #e4eeee;

        color: #98a6ab;

        font-size: 12px;
      }

      /* Responsive */

      @media (max-width: 500px) {
        .login-box {
          padding: 35px 25px;
        }

        .clinic-name {
          font-size: 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <!-- Header -->

      <div class="login-header">
        <div class="tooth-icon">🦷</div>

        <div class="clinic-name">Sunrise Dental Clinic</div>

        <h2>System Login</h2>

        <p>Sign in to access the clinic management system</p>
      </div>

      <!-- Login Form -->

      <form action="LoginServlet" method="post">
        <div class="form-group">
          <label for="username"> Username </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password"> Password </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="login-btn">🔐 Login</button>
      </form>

      <div class="security-note">
        🔒 This system is restricted to authorized Sunrise Dental Clinic staff
        and administrators.
      </div>

      <div class="back-section">
        <a href="index.html" class="back-link"> ← Back to Home </a>
      </div>

      <div class="footer">© 2026 Sunrise Dental Clinic</div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);

      if (params.get("error") === "invalid") {
        alert("Invalid username or password. Please try again.");
      }
    </script>
  </body>
</html>
