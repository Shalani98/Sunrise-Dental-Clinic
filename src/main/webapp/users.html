<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manage Users | Sunrise Dental Clinic</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #dff7fb, #f8fcfd);
        color: #29464f;
        padding: 35px 20px;
      }

      .page-container {
        width: 100%;
        max-width: 1050px;
        margin: auto;
      }

      /* Header */

      .page-header {
        background: #ffffff;

        padding: 30px;

        border-radius: 20px;
        border-top: 6px solid #13a9b8;

        text-align: center;

        margin-bottom: 25px;

        box-shadow: 0 12px 35px rgba(0, 105, 135, 0.12);
      }

      .tooth-icon {
        font-size: 45px;
        margin-bottom: 7px;
      }

      .page-header h1 {
        color: #087f94;
        font-size: 30px;
        margin-bottom: 5px;
      }

      .page-header h2 {
        color: #455f69;
        font-size: 21px;
        margin-bottom: 8px;
      }

      .page-header p {
        color: #80939a;
        font-size: 14px;
      }

      /* Action Bar */

      .action-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 18px;
      }

      .action-bar h3 {
        color: #405b66;
        font-size: 18px;
      }

      /* Add User Button */

      .add-btn {
        display: inline-block;

        padding: 11px 20px;

        background: linear-gradient(135deg, #16afbd, #087e98);

        color: #ffffff;

        text-decoration: none;

        border-radius: 9px;

        font-size: 14px;
        font-weight: 600;

        box-shadow: 0 5px 14px rgba(8, 126, 152, 0.2);

        transition: 0.25s;
      }

      .add-btn:hover {
        transform: translateY(-2px);

        box-shadow: 0 8px 18px rgba(8, 126, 152, 0.25);
      }

      /* Table Card */

      .table-card {
        background: #ffffff;

        padding: 25px;

        border-radius: 18px;

        box-shadow: 0 10px 30px rgba(0, 105, 135, 0.1);

        overflow-x: auto;
      }

      table {
        width: 100%;

        border-collapse: collapse;

        min-width: 650px;
      }

      thead {
        background: linear-gradient(135deg, #0fa8b8, #087f94);

        color: #ffffff;
      }

      th {
        padding: 14px 15px;

        text-align: left;

        font-size: 14px;
        font-weight: 600;
      }

      th:first-child {
        border-radius: 9px 0 0 0;
      }

      th:last-child {
        border-radius: 0 9px 0 0;
      }

      td {
        padding: 14px 15px;

        border-bottom: 1px solid #e4eeee;

        color: #48616b;

        font-size: 14px;
      }

      tbody tr {
        transition: 0.2s;
      }

      tbody tr:hover {
        background: #f0fafb;
      }

      /* Role Badge */

      .role {
        display: inline-block;

        padding: 6px 12px;

        border-radius: 20px;

        font-size: 12px;
        font-weight: 600;

        text-transform: capitalize;
      }

      .role-admin {
        background: #e8f1ff;
        color: #2866a8;
      }

      .role-staff {
        background: #e5f7ee;
        color: #287a50;
      }

      /* Delete Button */

      .delete-btn {
        padding: 8px 14px;

        border: 1px solid #e9a5a5;

        border-radius: 7px;

        background: #fff5f5;

        color: #c84646;

        font-size: 12px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;
      }

      .delete-btn:hover {
        background: #d95353;
        border-color: #d95353;
        color: white;
      }

      /* Loading / Empty Message */

      .message-row td {
        padding: 35px;

        text-align: center;

        color: #80939a;
      }

      /* Back */

      .back-section {
        text-align: center;
        margin-top: 25px;
      }

      .back-btn {
        display: inline-block;

        padding: 11px 22px;

        background: #ffffff;

        color: #087f94;

        border: 1px solid #bcdde1;

        border-radius: 9px;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;

        transition: 0.2s;
      }

      .back-btn:hover {
        background: #eaf8fa;
      }

      /* Footer */

      .footer {
        text-align: center;

        margin-top: 25px;

        color: #8d9da3;

        font-size: 12px;
      }

      /* Responsive */

      @media (max-width: 650px) {
        body {
          padding: 20px 12px;
        }

        .page-header {
          padding: 25px 18px;
        }

        .page-header h1 {
          font-size: 25px;
        }

        .action-bar {
          flex-direction: column;
          align-items: stretch;
          gap: 15px;
        }

        .add-btn {
          text-align: center;
        }

        .table-card {
          padding: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page-container">
      <!-- Header -->

      <div class="page-header">
        <div class="tooth-icon">🦷</div>

        <h1>Sunrise Dental Clinic</h1>

        <h2>Manage System Users</h2>

        <p>View, add and remove authorized system users</p>
      </div>

      <!-- Table -->

      <div class="table-card">
        <div class="action-bar">
          <h3>👥 System Users</h3>

          <a href="addUser.html" class="add-btn"> ＋ Add New User </a>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Username</th>

              <th>Role</th>

              <th>Action</th>
            </tr>
          </thead>

          <tbody id="userTable">
            <tr class="message-row">
              <td colspan="4">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Back -->

      <div class="back-section">
        <a href="adminDashboard.html" class="back-btn">
          ← Back to Admin Dashboard
        </a>
      </div>

      <!-- Footer -->

      <div class="footer">© 2026 Sunrise Dental Clinic Management System</div>
    </div>

    <script>
      // Load system users

      fetch("UserServlet")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Unable to load users");
          }

          return response.json();
        })

        .then((data) => {
          const table = document.getElementById("userTable");

          table.innerHTML = "";

          // No users

          if (!data || data.length === 0) {
            table.innerHTML = `

                    <tr class="message-row">

                        <td colspan="4">

                            No system users found.

                        </td>

                    </tr>

                `;

            return;
          }

          data.forEach((user) => {
            const row = document.createElement("tr");

            const role = user.role || "staff";

            const roleClass =
              role.toLowerCase() === "admin" ? "role-admin" : "role-staff";

            row.innerHTML = `


                    <td>
                        ${user.userId}
                    </td>


                    <td>
                        ${user.username}
                    </td>


                    <td>

                        <span class="role ${roleClass}">

                            ${role}

                        </span>

                    </td>


                    <td>


                        <form
                            action="UserServlet"
                            method="post"
                            onsubmit="return confirmDelete('${user.username}')"
                        >


                            <input
                                type="hidden"
                                name="action"
                                value="delete"
                            >


                            <input
                                type="hidden"
                                name="userId"
                                value="${user.userId}"
                            >


                            <button
                                type="submit"
                                class="delete-btn"
                            >

                                🗑 Delete

                            </button>


                        </form>


                    </td>


                `;

            table.appendChild(row);
          });
        })

        .catch((error) => {
          console.error("Error loading users:", error);

          document.getElementById("userTable").innerHTML = `

                <tr class="message-row">

                    <td colspan="4">

                        Unable to load system users.

                    </td>

                </tr>

            `;
        });

      // Delete confirmation

      function confirmDelete(username) {
        return confirm(
          "Are you sure you want to delete user '" + username + "'?",
        );
      }
    </script>
  </body>
</html>
